name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration on PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-superuser-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Test-only superuser of the throwaway service container. The tests create the sdlc roles,
      # a fresh database, run the real migrate process, and connect as sdlc_app.
      SDLC_TEST_ADMIN_JDBC_URL: jdbc:postgresql://localhost:5432/postgres
      SDLC_TEST_ADMIN_USER: postgres
      SDLC_TEST_ADMIN_PASSWORD: ci-superuser-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --verbose

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Create .env with random secrets
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "SDLC_DB_MIGRATOR_PASSWORD=$(openssl rand -hex 24)"
            echo "SDLC_DB_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "SDLC_DEV_SEED=true"
            echo "SDLC_DEV_SEED_PASSWORD=ci-demo-password-1"
            echo "SDLC_WEB_PORT=8080"
          } > .env
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for readiness through the web proxy
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health/readiness; then echo; exit 0; fi
            sleep 2
          done
          docker compose ps; docker compose logs --no-color; exit 1
      - name: Login, create a project, cross-tenant read is 404
        run: |
          set -euo pipefail
          B=http://localhost:8080
          tok() { awk '$6=="XSRF-TOKEN"{print $7}' "$1" | tail -1; }
          curl -sf -c a.jar -b a.jar $B/api/v1/auth/csrf > /dev/null
          curl -sf -c a.jar -b a.jar -H "X-CSRF-Token: $(tok a.jar)" -H 'Content-Type: application/json' \
            -d '{"organisation":"acme","email":"alice@acme.test","password":"ci-demo-password-1"}' $B/api/v1/auth/login
          ID=$(curl -sf -c a.jar -b a.jar -H "X-CSRF-Token: $(tok a.jar)" -H 'Content-Type: application/json' \
            -d '{"name":"CI smoke"}' $B/api/v1/projects | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          curl -sf -c g.jar -b g.jar $B/api/v1/auth/csrf > /dev/null
          curl -sf -c g.jar -b g.jar -H "X-CSRF-Token: $(tok g.jar)" -H 'Content-Type: application/json' \
            -d '{"organisation":"globex","email":"gina@globex.test","password":"ci-demo-password-1"}' $B/api/v1/auth/login > /dev/null
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -b g.jar $B/api/v1/projects/$ID)
          test "$CODE" = "404"
          curl -sf $B/ | grep -q '<div id="root">'
          echo "compose smoke: OK"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
