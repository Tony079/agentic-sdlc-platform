name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration on PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-superuser-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Test-only superuser of the throwaway service container. The tests create the sdlc roles,
      # a fresh database, run the real migrate process, and connect as sdlc_app.
      SDLC_TEST_ADMIN_JDBC_URL: jdbc:postgresql://localhost:5432/postgres
      SDLC_TEST_ADMIN_USER: postgres
      SDLC_TEST_ADMIN_PASSWORD: ci-superuser-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --verbose

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Create .env with random secrets
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "SDLC_DB_MIGRATOR_PASSWORD=$(openssl rand -hex 24)"
            echo "SDLC_DB_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "SDLC_DB_WORKER_PASSWORD=$(openssl rand -hex 24)"
            echo "SDLC_STORAGE_KEY=$(openssl rand -base64 32)"
            echo "SDLC_DEV_SEED=true"
            echo "SDLC_DEV_SEED_PASSWORD=ci-demo-password-1"
            echo "SDLC_WEB_PORT=8080"
          } > .env
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for readiness through the web proxy
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health/readiness; then echo; exit 0; fi
            sleep 2
          done
          docker compose ps; docker compose logs --no-color; exit 1
      - name: Login, create a project, cross-tenant read is 404
        run: |
          set -euo pipefail
          B=http://localhost:8080
          tok() { awk '$6=="XSRF-TOKEN"{print $7}' "$1" | tail -1; }
          curl -sf -c a.jar -b a.jar $B/api/v1/auth/csrf > /dev/null
          curl -sf -c a.jar -b a.jar -H "X-CSRF-Token: $(tok a.jar)" -H 'Content-Type: application/json' \
            -d '{"organisation":"acme","email":"alice@acme.test","password":"ci-demo-password-1"}' $B/api/v1/auth/login
          ID=$(curl -sf -c a.jar -b a.jar -H "X-CSRF-Token: $(tok a.jar)" -H 'Content-Type: application/json' \
            -d '{"name":"CI smoke"}' $B/api/v1/projects | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          curl -sf -c g.jar -b g.jar $B/api/v1/auth/csrf > /dev/null
          curl -sf -c g.jar -b g.jar -H "X-CSRF-Token: $(tok g.jar)" -H 'Content-Type: application/json' \
            -d '{"organisation":"globex","email":"gina@globex.test","password":"ci-demo-password-1"}' $B/api/v1/auth/login > /dev/null
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -b g.jar $B/api/v1/projects/$ID)
          test "$CODE" = "404"
          curl -sf $B/ | grep -q '<div id="root">'
          echo "compose smoke (Milestone 1): OK"
      - name: Requirement create, edit and submit through the proxy (Milestone 2)
        run: |
          set -euo pipefail
          B=http://localhost:8080
          tok() { awk '$6=="XSRF-TOKEN"{print $7}' "$1" | tail -1; }
          json() { python3 -c "import sys,json;d=json.load(sys.stdin);print($1)"; }
          curl -sf -c r.jar -b r.jar $B/api/v1/auth/csrf > /dev/null
          curl -sf -c r.jar -b r.jar -H "X-CSRF-Token: $(tok r.jar)" -H 'Content-Type: application/json' \
            -d '{"organisation":"acme","email":"aaron@acme.test","password":"ci-demo-password-1"}' $B/api/v1/auth/login > /dev/null
          P=$(curl -sf -c r.jar -b r.jar -H "X-CSRF-Token: $(tok r.jar)" -H 'Content-Type: application/json' \
            -d '{"name":"CI requirements"}' $B/api/v1/projects | json 'd["id"]')
          R=$(curl -sf -c r.jar -b r.jar -H "X-CSRF-Token: $(tok r.jar)" -H 'Content-Type: application/json' \
            -H "Idempotency-Key: $(python3 -c 'import uuid;print(uuid.uuid4())')" \
            -d "{\"projectId\":\"$P\",\"kind\":\"NEW_PRODUCT\",\"title\":\"CI draft\"}" $B/api/v1/requirements)
          ID=$(echo "$R" | json 'd["id"]'); V=$(echo "$R" | json 'd["version"]')
          echo "$R" | json 'd["key"]' | grep -Eq '^REQ-[0-9]{6}$'
          R=$(curl -sf -c r.jar -b r.jar -X PUT -H "X-CSRF-Token: $(tok r.jar)" -H 'Content-Type: application/json' \
            -H "If-Match: \"$V\"" -d '{"kind":"NEW_PRODUCT","title":"CI requirement","description":"d","businessObjective":"b","expectedOutcomes":"e","constraints":"None","integrations":"Not applicable"}' \
            $B/api/v1/requirements/$ID)
          V=$(echo "$R" | json 'd["version"]')
          STATE=$(curl -sf -c r.jar -b r.jar -X POST -H "X-CSRF-Token: $(tok r.jar)" -H "If-Match: \"$V\"" \
            $B/api/v1/requirements/$ID/submit | json 'd["state"]')
          test "$STATE" = "SUBMITTED"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -b g.jar $B/api/v1/requirements/$ID)
          test "$CODE" = "404"
          echo "compose smoke (Milestone 2): OK"
          echo "$ID" > req.id
      - name: Worker routes the submitted requirement through the outbox (Milestone 3)
        run: |
          set -euo pipefail
          B=http://localhost:8080
          ID=$(cat req.id)
          # The Milestone 2 smoke requirement is NEW_PRODUCT, so the worker must route it to MANUAL_INTAKE (T03).
          for i in $(seq 1 60); do
            STATE=$(curl -sf -b r.jar $B/api/v1/requirements/$ID | python3 -c 'import sys,json;print(json.load(sys.stdin)["state"])')
            if [ "$STATE" != "SUBMITTED" ]; then echo "routed: $STATE"; break; fi
            sleep 2
          done
          test "$STATE" = "MANUAL_INTAKE"
          test "$(docker compose ps worker --format '{{.State}}')" = "running"
          echo "compose smoke (Milestone 3): OK"
      - name: Attachment upload, real ClamAV scan and download; EICAR blocked (Milestone 4)
        run: |
          set -euo pipefail
          B=http://localhost:8080
          ID=$(cat req.id)
          tok() { awk '$6=="XSRF-TOKEN"{print $7}' "$1" | tail -1; }
          json() { python3 -c "import sys,json;d=json.load(sys.stdin);print($1)"; }
          printf 'Process notes for the CI smoke test.\n' > notes.txt
          # The EICAR test string is assembled at run time so it never sits in the repository.
          printf '%s%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-' 'ANTIVIRUS-TEST-FILE!$H+H*' > eicar.txt
          up() { curl -sf -c r.jar -b r.jar -H "X-CSRF-Token: $(tok r.jar)" -F "file=@$1;type=text/plain" \
            $B/api/v1/requirements/$ID/documents | json 'd["documentId"]'; }
          CLEAN=$(up notes.txt); BAD=$(up eicar.txt)
          state() { curl -sf -b r.jar $B/api/v1/requirements/$ID/documents | python3 -c \
            "import sys,json;print([i['state'] for i in json.load(sys.stdin)['items'] if i['documentId']=='$1'][0])"; }
          for i in $(seq 1 120); do
            if [ "$(state $CLEAN)" = "READY_FOR_EXTRACTION" ] && [ "$(state $BAD)" = "REJECTED_MALWARE" ]; then break; fi
            sleep 3
          done
          test "$(state $CLEAN)" = "READY_FOR_EXTRACTION"
          test "$(state $BAD)" = "REJECTED_MALWARE"
          curl -sf -b r.jar $B/api/v1/requirements/$ID/documents/$CLEAN/content | cmp - notes.txt
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -b r.jar $B/api/v1/requirements/$ID/documents/$BAD/content)
          test "$CODE" = "409"
          echo "compose smoke (Milestone 4): OK"
      - name: Extraction of a scanned document into text chunks (Milestone 5, synthetic document)
        run: |
          set -euo pipefail
          B=http://localhost:8080
          tok() { awk '$6=="XSRF-TOKEN"{print $7}' "$1" | tail -1; }
          json() { python3 -c "import sys,json;d=json.load(sys.stdin);print($1)"; }
          # A draft EXISTING_REPOSITORY requirement (not MANUAL_INTAKE, where extraction is never scheduled).
          P=$(curl -sf -c r.jar -b r.jar -H "X-CSRF-Token: $(tok r.jar)" -H 'Content-Type: application/json' \
            -d '{"name":"CI extraction"}' $B/api/v1/projects | json 'd["id"]')
          RID=$(curl -sf -c r.jar -b r.jar -H "X-CSRF-Token: $(tok r.jar)" -H 'Content-Type: application/json' \
            -d "{\"projectId\":\"$P\",\"kind\":\"EXISTING_REPOSITORY\",\"title\":\"CI extraction\"}" \
            $B/api/v1/requirements | json 'd["id"]')
          printf '# Repayment rules\nEvery repayment carries a channel code.\n' > rules.md
          DOC=$(curl -sf -c r.jar -b r.jar -H "X-CSRF-Token: $(tok r.jar)" -F "file=@rules.md;type=text/markdown" \
            $B/api/v1/requirements/$RID/documents | json 'd["documentId"]')
          for i in $(seq 1 100); do
            STATE=$(curl -sf -b r.jar $B/api/v1/requirements/$RID/documents | json 'd["items"][0]["state"]')
            if [ "$STATE" = "PROCESSED" ]; then break; fi
            sleep 3
          done
          echo "document state: $STATE"
          test "$STATE" = "PROCESSED"
          COUNT=$(docker compose exec -T db psql -U postgres -d sdlc -tAc \
            "select count(*) from app.document_chunk c join app.document_version v on v.id = c.version_id where v.document_id = '$DOC'")
          test "$COUNT" -ge 1
          echo "compose smoke (Milestone 5): OK"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
