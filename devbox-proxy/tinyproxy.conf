Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 100
LogLevel Notice
# Only the devbox network may use the proxy.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
# Only registry hosts (regular expressions, matched against the host); everything else is refused.
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/tinyproxy/allowlist"
ConnectPort 443
ConnectPort 80
DisableViaHeader Yes
