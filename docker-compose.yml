# Local development stack. Copy .env.example to .env and replace every placeholder secret first.
# Not production configuration: no TLS, development seed data, cookies without the Secure flag.
#
#   docker compose up --build        then open http://localhost:${SDLC_WEB_PORT:-8080}
#
# Attachments: private encrypted file store on the shared volume doc-store (D-M4-01; production store is O-12) and
# ClamAV as the development scanner (FR-STO-11; production scanner is O-03).
name: sdlc-platform

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      SDLC_DB_NAME: sdlc
      SDLC_DB_MIGRATOR_PASSWORD: ${SDLC_DB_MIGRATOR_PASSWORD:?set SDLC_DB_MIGRATOR_PASSWORD in .env}
      SDLC_DB_APP_PASSWORD: ${SDLC_DB_APP_PASSWORD:?set SDLC_DB_APP_PASSWORD in .env}
      SDLC_DB_WORKER_PASSWORD: ${SDLC_DB_WORKER_PASSWORD:?set SDLC_DB_WORKER_PASSWORD in .env}
      SDLC_BOOTSTRAP_DIR: /sdlc-bootstrap
    volumes:
      - ./db/bootstrap:/sdlc-bootstrap:ro
      - ./db/bootstrap/init.sh:/docker-entrypoint-initdb.d/10-sdlc-init.sh:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sdlc"]
      interval: 5s
      timeout: 5s
      retries: 20
    # The database port is not published. Uncomment for local tooling only:
    # ports: ["127.0.0.1:5432:5432"]

  migrate:
    build: ./backend
    image: sdlc-platform-backend:local
    command: ["--spring.profiles.active=migrate"]
    environment:
      SDLC_DB_URL: jdbc:postgresql://db:5432/sdlc
      SDLC_DB_MIGRATOR_PASSWORD: ${SDLC_DB_MIGRATOR_PASSWORD}
      SDLC_DEV_SEED: ${SDLC_DEV_SEED:-false}
      SDLC_DEV_SEED_PASSWORD: ${SDLC_DEV_SEED_PASSWORD:-}
      SDLC_LOG_FORMAT: ""
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: sdlc-platform-backend:local
    environment:
      SDLC_DB_URL: jdbc:postgresql://db:5432/sdlc
      SDLC_DB_APP_PASSWORD: ${SDLC_DB_APP_PASSWORD}
      # Local HTTP only. Must be true (the default) behind TLS.
      SDLC_COOKIE_SECURE: "false"
      SDLC_STORAGE_KEY: ${SDLC_STORAGE_KEY:?set SDLC_STORAGE_KEY in .env}
    volumes:
      - doc-store:/var/lib/sdlc/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Background worker (Milestone 3): transactional outbox dispatcher and job queue, as login sdlc_worker.
  # Same image, no HTTP port. Healthy while its poll loop keeps the liveness file fresh.
  worker:
    image: sdlc-platform-backend:local
    command: ["--spring.profiles.active=worker"]
    environment:
      SDLC_DB_URL: jdbc:postgresql://db:5432/sdlc
      SDLC_DB_WORKER_PASSWORD: ${SDLC_DB_WORKER_PASSWORD}
      SDLC_STORAGE_KEY: ${SDLC_STORAGE_KEY}
      SDLC_SCANNER_HOST: clamav
      # Local development only: synthetic documents. Real client documents need O-15 (extractor isolation) first.
      SDLC_DOCUMENT_EXTRACTION_ENABLED: "true"
    volumes:
      - doc-store:/var/lib/sdlc/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/sdlc-worker-alive -mmin -1 2>/dev/null)\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  # Development malware scanner (clamd on 3310, internal network only). Downloads signatures at start-up; until it is
  # ready, uploads stay QUARANTINED (fail closed).
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${SDLC_WEB_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  doc-store:
