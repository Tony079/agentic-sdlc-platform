# Runtime configuration (api). Secrets come only from the environment; nothing secret is committed.
spring:
  application:
    name: sdlc-platform
  autoconfigure:
    # Users authenticate only through the tenant login endpoint; form login and HTTP Basic are disabled. Without this
    # exclusion Spring Boot creates an unused in-memory user and prints its generated password to the log (SEC-M3-01).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SDLC_DB_URL:jdbc:postgresql://localhost:5432/sdlc}
    username: ${SDLC_DB_APP_USER:sdlc_app}
    password: ${SDLC_DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${SDLC_DB_POOL_SIZE:10}
  liquibase:
    # The runtime never migrates. Migrations run in the separate "migrate" profile/process.
    enabled: false
  session:
    timeout: 30m
    jdbc:
      table-name: app.spring_session
      initialize-schema: never
  servlet:
    multipart:
      # Attachments (PRD FR-UPL-04): spooled to a temporary file, never held in memory; the service applies the
      # per-requirement count and total limits.
      max-file-size: ${SDLC_DOCUMENTS_MAX_FILE_BYTES:20971520}
      max-request-size: 21MB
      file-size-threshold: 0
  jackson:
    deserialization:
      # Unknown JSON fields are rejected (TDD 20.1), so e.g. a client-supplied tenantId is never silently accepted.
      fail-on-unknown-properties: true

server:
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SDLC_SESSION
        http-only: true
        same-site: strict
        secure: ${SDLC_COOKIE_SECURE:true}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

logging:
  structured:
    format:
      console: ${SDLC_LOG_FORMAT:ecs}

sdlc:
  staff:
    # Encrypts staff TOTP secrets (O-11). 32 random bytes, base64 (openssl rand -base64 32); required by the api and
    # provision processes. Never stored in the database.
    mfa-key: ${SDLC_MFA_KEY:}
  # Garuda (GD-04): the address people open from invitation and password-reset emails, e.g. https://garuda.example.com.
  public-base-url: ${SDLC_PUBLIC_BASE_URL:http://localhost:8080}
  mail:
    # Account email (invitations, password resets) over SMTPS. Gmail: host smtp.gmail.com, port 465, username = the
    # Google account, password = an App Password (needs 2-Step Verification) supplied as the secret mail.smtp-password
    # (SDLC_SECRET_MAIL_SMTP_PASSWORD or a mounted secret file). Without a host, admins copy links instead.
    host: ${SDLC_MAIL_HOST:}
    port: ${SDLC_MAIL_PORT:465}
    username: ${SDLC_MAIL_USERNAME:}
    from: ${SDLC_MAIL_FROM:}
    from-name: ${SDLC_MAIL_FROM_NAME:Garuda}
  security:
    # GD-08: Organisation Admins complete sign-in with TOTP. Refused as false in production.
    org-admin-mfa-required: ${SDLC_ORG_ADMIN_MFA_REQUIRED:true}
    # Absolute session lifetime (TDD 22.2): sessions older than this are invalidated regardless of activity.
    absolute-session-timeout: 8h
    login-throttle:
      max-failures-per-account: 5
      max-failures-per-client: 20
      window: 10m
  worker:
    # The API process never dispatches events or runs jobs; the worker profile enables both.
    enabled: false
  documents:
    max-file-bytes: ${SDLC_DOCUMENTS_MAX_FILE_BYTES:20971520}
    max-files: 10
    max-total-bytes: 104857600
    extraction:
      # SECURE GATE (O-15, OPEN - BLOCKING): parsing of real client documents stays off until the extractor
      # isolation spike M3S is accepted. Local development and tests switch it on explicitly.
      enabled: ${SDLC_DOCUMENT_EXTRACTION_ENABLED:false}
      timeout: 120s
      max-heap: 256m
  storage:
    # Private encrypted object store (D-M4-01). Both api and worker mount the same directory. The key is
    # 32 random bytes, base64 (openssl rand -base64 32); without it the application does not start.
    root: ${SDLC_STORAGE_ROOT:/var/lib/sdlc/documents}
    encryption-key: ${SDLC_STORAGE_KEY:}
  model:
    # Model gateway (TDD 13). O-01 (provider selection) is OPEN: no provider is configured by default, so every model
    # call fails with CONFIGURATION_ERROR and no data leaves the platform. "fake" (deterministic, no network) is for
    # local development and tests only. Never accepted from a request.
    provider: ${SDLC_MODEL_PROVIDER:none}
    model-id: ${SDLC_MODEL_ID:}
    timeout: 120s
    max-transient-retries: 2
    retry-backoff: 2s
    # Upper bound of concurrent provider calls per process; when full, calls fail as PROVIDER_UNAVAILABLE (deferral).
    max-concurrent-calls: 16
    budget:
      # FR-LLM-05 caps; values are owner decision O-09 (open). Empty = no cap.
      tenant-monthly-usd: ${SDLC_MODEL_BUDGET_TENANT_MONTHLY_USD:}
      requirement-usd: ${SDLC_MODEL_BUDGET_REQUIREMENT_USD:}
  scanner:
    clamd:
      host: ${SDLC_SCANNER_HOST:localhost}
      port: ${SDLC_SCANNER_PORT:3310}
      timeout: 60s
