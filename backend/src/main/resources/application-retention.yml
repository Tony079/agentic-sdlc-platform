# One-shot retention and deletion process (PRD FR-RET, S-01). Connects as sdlc_retention, the only login that may
# delete derived data and expired audit rows. Serves no HTTP, runs one command, then exits. Schedule "apply" daily.
spring:
  main:
    web-application-type: none
    banner-mode: off
  datasource:
    username: ${SDLC_DB_RETENTION_USER:sdlc_retention}
    password: ${SDLC_DB_RETENTION_PASSWORD:}
    hikari:
      maximum-pool-size: 2

sdlc:
  retention:
    # Owner decision O-25 (2026-11-08) defaults, in days after the recorded closure (audit: after the event).
    # Temporary extraction artifacts 30; closed-requirement business artifacts 365; audit 365. Operational application
    # logs (90 days) are kept by the log platform, not by this process. Per-tenant overrides: app.retention_policy.
    default-days:
      snapshot: ${SDLC_RETENTION_SNAPSHOT_DAYS:30}
      extracted-text: ${SDLC_RETENTION_EXTRACTED_TEXT_DAYS:30}
      document: ${SDLC_RETENTION_DOCUMENT_DAYS:365}
      brd: ${SDLC_RETENTION_BRD_DAYS:365}
      audit: ${SDLC_RETENTION_AUDIT_DAYS:365}
