server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Attachment uploads (PRD FR-UPL-04: 20 MB per file): streamed to the API, not buffered by the proxy. The API
    # enforces the real limits; this only allows the multipart request through.
    location ~ ^/api/v1/requirements/[^/]+/documents$ {
        client_max_body_size 21m;
        proxy_request_buffering off;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only the health endpoints are exposed through the proxy.
    location /actuator/health {
        proxy_pass http://api:8080;
    }

    location / {
        try_files $uri /index.html;
    }
}
